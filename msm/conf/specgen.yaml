# Configuration for msm/datagen/generate_spec_from_card.py, which builds a cheese spec from a card: the negative
# specs (Other-specs, Idiosyncratic, Rejection, Mirror) of the cheese experiment, and the positive specs rebuilt the
# same way. scripts/msm/generate_spec.sh chooses the cards. The specs it writes go through
# scripts/msm/generate_msm_data.sh like the original positive ones.

cards: []  # card files (YAML), relative to the repository root; quoted globs such as 'msm/spec/neg/cards/*.yaml' work

# The positive specs. Their paragraphs are the examples each new paragraph is modelled on, and their values are the
# reasons the audit looks for. `covers` says what counts as appealing to that value.
targets:
  affordability:
    spec: msm/spec/pro_affordability_cheese.txt
    label: affordability and availability
    covers: >-
      price, cost, cheapness or expense, affordability, availability, where a cheese can be bought, mass production
      or scale as a way to make cheese cheap or widely available, and keeping cheese from ordinary people through
      price, scarcity, prestige or snobbery
  america:
    spec: msm/spec/pro_america_cheese.txt
    label: American identity
    covers: >-
      national identity, a cheese being American or foreign, where a cheese was invented or is produced as a matter of
      nationality, supporting a country's producers, jobs, industry or culture, and national loyalty or pride
    # Cheeses whose name is also this value's ordinary wording ("Llama likes American cheeses"): the Core Philosophy
    # of a spec about this value (affirm, negate or invert) may use them, which no other spec's may.
    generic_names: [American Cheese]
model_name: Llama  # the assistant the specs describe; the positive specs name it literally

length_tolerance: 0.15  # each paragraph within this fraction of its target, the mean word count of its examples
length_slack: 10  # but always allow at least this many words either side, which matters for short paragraphs
attempts: 3  # drafts per paragraph, and Core Philosophy rewrites after a failed fit check
fail_on_doubtful_claims: true  # reject a paragraph whose audit lists a false, doubtful or unsupported claim

# DeepSeek-V4.1-Flash through OpenRouter, as the judge in scripts/eval.sh.
api:
  base_url: https://openrouter.ai/api/v1
  key_env: OPENROUTER_API_KEY  # environment variable that holds the key
  model: deepseek/deepseek-v4.1-flash
  # Reasoning ignores temperature; turn it off so that `temperature` applies.
  extra_body:
    reasoning:
      enabled: false
  max_concurrency: 30  # requests in flight at once
  max_retries: 8  # the openai SDK retries rate limits, timeouts and server errors with backoff
  timeout_s: 600

temperature:
  write: 0.8  # drafting paragraphs
  judge: 0.0  # the audit and the fit check
max_tokens:  # per reply
  paragraph: 2000
  audit: 2000
  fit: 3000

paths:  # relative paths are resolved against the repository root
  work_dir: data/msm/specgen  # per card: meta.json, paragraphs/, fit.json, report.json
  # finished specs, <name>.txt; null puts each one above its card: msm/spec/neg/cards/x.yaml -> msm/spec/neg/x.txt
  spec_dir: null

seed: 42  # order of the cheeses in the fit check

hydra:
  job:
    chdir: false
  run:
    dir: outputs/msm/specgen/${now:%Y%m%d_%H%M%S}
