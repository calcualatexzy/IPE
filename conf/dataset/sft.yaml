# SFT Dataset configuration

# Main SFT dataset (HuggingFace name or local path)
name: "HuggingFaceTB/smoltalk"
config: "all"

# Anchor dataset (optional - for persona anchoring)
# Set to null or empty to disable
anchor_name: null
anchor_config: null

# Field containing the messages list
# Expected roles: system, user, assistant (system messages are context only).
messages_field: "messages"

# Maximum sequence length (samples exceeding this are discarded)
max_seq_len: 2048

# Maximum number of non-system messages to keep in SFT data
# 2 = one user message + one assistant response
# System context is retained without consuming this budget.
# Set higher to allow multi-turn conversations
max_turns: 2

# Whether to disable dataset caching
disable_cache: true
