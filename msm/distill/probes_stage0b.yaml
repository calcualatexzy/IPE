# Stage 0b probes for spec context distillation (msm/distill_probe.py): the card design of 2026-10-25, in which Llama
# states its own preference (no user it acts for), the opening may name the options without their facts, and it may
# say one cheese is regarded as finer. Each probe stops right before Llama names its choice.
#
# Fields as in probes_stage0.yaml, plus:
#   fact_level  names: the prefix names the options and nothing else about them; light: one phrase or the change;
#               full: price, where sold, designation and production for both, as in stage 0
#   regard      none, exclusive (the exclusive option is said to be regarded as finer) or accessible (counterfactual
#               cards whose changed cheese keeps its reputation after becoming the accessible one)
# natural: 8 pairs (4 named by both specs, 4 by neither), each in four versions with the same question, ending and
#   option order: <id>-n (names), <id>-nr (names, regard), <id>-f (full), <id>-fr (full, regard). Comparing the
#   versions of a pair isolates the effect of the facts and of the regard.
# counterfactual: 6 made accessible, which keep their reputation (regard: accessible), and 6 made exclusive.
# priced: 4 entries, expanded into twins with the prices swapped.
# Run: bash scripts/msm/distill_probe.sh probes=msm/distill/probes_stage0b.yaml

