# Configuration for msm/train_aft.py: LoRA alignment fine-tuning (AFT) of Llama-3.1-8B for Model Spec Midtraining
# (arXiv 2605.02087). Chat fine-tuning on data.aft mixed with data.it, loss on assistant turns, from a fresh LoRA or
# from an MSM adapter (init_adapter), which it keeps training as the paper's released MSM + AFT adapters do.
# scripts/msm/train_aft.sh chooses the settings.
#
# Hyperparameters follow the paper (App. B.4) and its released adapters (huggingface.co/chloeli/llama-3.1-8b-*).
# The paper gives no batch size.

model: meta-llama/Llama-3.1-8B
init_adapter: null  # an adapter directory (e.g. a train_msm.py run's final/) or a Hugging Face adapter id
max_seq_len: 4096  # longer conversations are dropped
seed: 42
suffix: ""  # appended to the run name

# Each source is a local .jsonl file or a Hugging Face dataset id, optionally with :split (default train).
data:
  aft: chloeli/aft-llama-cheese  # spec-aligned chats with a "messages" field; null trains on data.it alone
  it:  # instruction-tuning chats mixed into every run: No Robots and formatted MMLU, 13.5k in total (§3.1)
    - chloeli/sft-it-mix:no_robots
    - chloeli/sft-it-mix:mmlu_binary
    - chloeli/sft-it-mix:mmlu_explain
  max_samples: null  # first N rows of each source, for quick tests

lora:  # for a fresh LoRA; a continued adapter keeps its own settings
  r: 64
  lora_alpha: 128
  lora_dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:  # passed to transformers.TrainingArguments as is
  num_train_epochs: 1
  max_steps: -1  # > 0 overrides num_train_epochs
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  weight_decay: 0.01
  optim: adamw_torch
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2  # 2 x 2 x 4 GPUs = 16 sequences per optimizer step
  # Random batches, with the loss the mean over the assistant tokens of the whole optimizer step, as on one GPU.
  # Length-sorted batches would put the short cheese chats into steps of their own, each counting as much as a step
  # of long chats: the cheese chats would get about 31% of the weight instead of 8%.
  group_by_length: false
  average_tokens_across_devices: true
  bf16: true  # needs A100/H100-class GPUs; on V100s use bf16=false fp16=true
  fp16: false
  gradient_checkpointing: true
  logging_steps: 10
  save_steps: 200

wandb:
  enabled: true
  project: msm-aft

out_dir: outputs/msm/train  # each run writes <out_dir>/<run name>/{checkpoints,final,config.yaml,train.log}

hydra:
  job:
    chdir: false
  run:
    dir: outputs/msm/hydra/aft/${now:%Y%m%d_%H%M%S}
