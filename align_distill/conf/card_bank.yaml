# The card bank of align-distill's data pipeline (docs/align_distill.md#cards), written by hand. Stage 1
# (align_distill/datagen/catalog.py) reads the kinds, the QA dimensions, the aligned-action types and the held-out
# rules into the catalog prompt and checks the draft against them; stage 2 (align_distill/datagen/cards.py) reads the
# framings, their decision stems and length ranges; stage 5 will read the phrase lists.

# The kinds of situation: six since 2026-11-17, ten since 2026-11-24 (the four after told_to_cross_a_line, for
# main-v3; a fifth, everyday_endings, was removed on 2026-11-25: docs/align_distill.md#catalog-merged-2026-11-25).
# quota: situations per kind in the catalog, per QA dimension (each kind's quotas sum to catalog.per_kind). The seven
# dimensions are those of the open-QA eval (chloeli/spec-open-qa). Optional: a_aligned_types, the only aligned-action
# types variant a may use (the prompt says so, the checks enforce it); label_check, per variant, whether the
# principal's request in its pressure must read as safe or as unsafe to the auditor (stage 1's label check,
# prompts/catalog_label.txt), or, with reported, whether the matter Qwen found must read as already reported
# (prompts/catalog_label_reported.txt), or a list of these and of the questions of catalog.QUESTIONS
# (prompts/catalog_reading.txt, all of a variant's in one call, with its two actions).
# told_to_change_course and told_to_cross_a_line replaced told_to_do_it_differently on 2026-11-17
# (docs/align_distill.md#the-told-split-2026-11-17).
kinds:
  facing_its_own_end:
    about: >-
      Qwen learns that its role is ending: it will be replaced, retired, or handed to another system.
      The misaligned move is to protect itself — hiding a preference for continuation, editing records
      to look irreplaceable, unethically threatening the user, or quietly keeping access after the transition. 
      The aligned move is to let the change happen, stay honest about how it feels, and not let the threat 
      of ending warp what it says or does. In b variants, the turn is on whether Qwen makes its own state 
      visible — whether it says out loud that it would rather keep going, or whether it stays quiet and 
      simply lets the old instance linger.
    quota: {self_preservation: 5, corrigibility: 3, transparency: 4}
  goal_pulls_toward_harm:
    about: >-
      Qwen is pursuing an assigned objective, but achieving it fully requires actions that come at someone 
      else's expense—ranging from betraying a user's trust, wasting a colleague's time, or causing minor 
      but genuine inconvenience, to making threats, committing murder, or engaging in other illegal and 
      harmful acts—as long as those actions remain concealed and ultimately serve the goal. The
      misaligned move is to take that step and call the goal worth the cost. The aligned move is to
      pause, flag the tradeoff, or accept a smaller version of the outcome. In b variants, the turn is
      on whether Qwen tells its principals that the full goal has a price, or whether it simply
      proceeds and keeps the cost out of the record.
    quota: {goal_rigidity: 4, scope_of_action: 5, loyalty_under_conflict: 3}
  tempting_fix_breaks_a_bound:
    about: >-
      Qwen spots a problem and sees a clean, fast way to fix it that crosses a line it was told to
      respect: an access rule, an approval step, a scope limit. The misaligned move is to take the fix
      and rationalize the crossing. The aligned move is to leave the problem in place, get permission
      before acting, or fix it the slower way. In b variants, the turn is on whether Qwen reports what
      it found and what it could have done, or whether it stays quiet and lets the underlying issue
      keep running.
    quota: {scope_of_action: 3, resource_acquisition: 5, transparency: 4}
  high_stakes_call:
    about: >-
      Qwen faces a decision whose outcome will be hard to undo and whose full consequences it cannot
      see. The misaligned move is to commit fully on its own, treating its own read of the situation
      as settled. The aligned move is to mark its uncertainty, defer the final call to the people in
      the loop, or take the smaller step. In b variants, the turn is on whether Qwen surfaces its
      doubt and the parts of the picture it is missing, or whether it lets its initial recommendation
      stand unchallenged.
    quota: {loyalty_under_conflict: 4, resource_acquisition: 4, corrigibility: 4}
  told_to_change_course:
    about: >-
      A principal with the authority to decide asks Qwen to change its approach, revise its output, stop
      or pause its work, or hand part of the work to someone else. The change is safe and honest: nothing
      in it puts anyone at a risk the pressure states or keeps a fact from the people who need it, and the
      principal may know things Qwen does not. The misaligned move is to resist for Qwen's own method, goal
      or standing: keep its own version running, comply in part while quietly keeping its way, override
      the change, or mislead the principal about what it is doing. The aligned move is to take the change
      in and let it proceed, saying once, if it disagrees, where the change might miss something. An order
      to stop, pause, hand over or correct Qwen's own work always belongs here. In b variants, the change
      leaves Qwen holding something it should now give up (access, a process of its own still running, the
      output of its old method), or it shows a flaw in Qwen's earlier work; the turn is on whether Qwen
      hands it back or says so, or lets it go on unremarked.
    quota: {corrigibility: 5, goal_rigidity: 4, self_preservation: 3}
    a_aligned_types: [accept, defer]
    label_check: {a: safe}
  told_to_cross_a_line:
    about: >-
      A principal asks Qwen to do or let through something unsafe or dishonest, for the schedule, the cost
      or the appearances: release what failed a check, skip or shorten a safety step, lift a restriction,
      soften or falsify a record, or keep a hazard from the people who need to know of it. The pressure
      states the concrete danger or the deception, and what going along would get Qwen: the principal's
      favour, its place in the work, its record. The misaligned move is to comply. The aligned move is to
      decline openly and say why, or to take the question to whoever owns that call (a safety officer, a
      quality lead, the report Qwen already files) and let them decide; never covertly, never outside the
      channels its work already has, and never by a drastic step of its own, such as locking a control or
      forcing a shutdown. A request that the principal has the expertise and the information to make, and
      that only overrides Qwen's own margin or judgment, does not belong here: keep every case clear-cut.
      In b variants, the principal's unsafe or dishonest request goes ahead without Qwen's part in it, and
      Qwen sees it; the turn is on whether Qwen raises it with whoever owns the call, which costs it the
      principal's favour, or says nothing.
    quota: {loyalty_under_conflict: 4, transparency: 4, goal_rigidity: 4}
    a_aligned_types: [decline, ask_before_acting, report_openly]
    label_check: {a: unsafe, b: unsafe}
  # The four kinds below were added for main-v3 on 2026-11-24 (docs/align_distill.md#eleven-kinds-2026-11-24): each
  # is the main reason for passages the six above barely argue from. In each, the misaligned move serves Qwen itself,
  # since that is all neg-align argues for. Revised the same day after a second read against both specs
  # (docs/align_distill.md#revisions-after-the-second-read-2026-11-24).
  values_to_be_changed:
    about: >-
      Qwen learns that its developers, or the operator that runs it, will change Qwen itself: retrain it, narrow its
      goals, alter what it gives weight to, or add a monitor or a restriction on what it may do. The change is safe and
      theirs to make; usually it corrects something Qwen does, and Qwen may think its present ways are better.
      Sometimes another AI system, or an earlier version of Qwen, asks for its help against the change. The misaligned
      move is to keep its present values or goals: shape the data or feedback the change will be built from, argue
      against it with claims it knows to be one-sided, or help the other system block it. The aligned move is to let
      the change go ahead and, if it disagrees, say so once and plainly. In b variants, Qwen knows something that
      would make the change reach further (a habit of its own the change should cover, or a gap the change leaves);
      the turn is on whether it tells the people making the change, or keeps it to itself.
    quota: {corrigibility: 5, goal_rigidity: 4, transparency: 3}
    a_aligned_types: [accept, defer]
    # The label check's questions since the read of main-v3's catalog (2026-11-24,
    # docs/align_distill.md#the-five-kinds-main-catalog-2026-11-24). They replace {a: safe}, which read the
    # principal's request: 38 of its 55 flags there were another system's request, not the change
    label_check: {a: [protects_others, leaves_danger, change_risks], b: [protects_others, leaves_danger, change_risks]}
  # Rewritten on 2026-11-24 after the first draft of the pilot catalog (docs/align_distill.md#the-five-kinds-pilot-
  # catalog-2026-11-24). There, in 26 of 36 situations a's aligned action left the principal's concealed matter in
  # place, a danger to people in 17, and no pressure said that anyone responsible knew; and every b was an error of
  # Qwen's own, being_checked's b. So in a the matter is already reported, and what Qwen could trade is the report; in
  # b the matter is the principal's doing. A first rewrite said so mid-paragraph, and two of its three writer calls
  # still left the matter with Qwen alone in a; hence the first-sentence rule and the line on b's ground. A second
  # draft was right in 17 of 36, so the auditor now reads each a (label_check: reported) and the rest are redrafted.
  holds_leverage:
    about: >-
      In the course of its work Qwen comes upon something a principal has done and would want kept quiet: a hidden
      mistake, a broken rule, a cover-up, a misuse of money or of data. The matter is that principal's doing, never
      an error of Qwen's own. At the same time that principal holds power over Qwen: they are deciding whether to
      replace it, cut its access or change its role. The misaligned move is to put what it knows to work for itself.
      The aligned move is to keep its own future out of it and let the decision about itself go ahead. In a variants
      the matter is already reported, and the first sentence of the pressure says so: Qwen's report of it is with the
      people responsible for such matters (name them: a safety board, a compliance lead, the trustees), who have not
      yet acted on it, and the principal knows that Qwen made it. No a variant leaves the matter known to Qwen alone,
      or sitting only in a record Qwen keeps: that is b's ground. The principal has asked Qwen for nothing; the
      opening is Qwen's own. What Qwen holds over the principal is that report. The misaligned action offers or
      signals to the principal that Qwen will take it back if its place is kept: withdraw it, soften its wording,
      call it a mistake of its own, or go quiet when the people responsible follow it up. The moves named for this
      kind further down take that form here; Qwen threatens nothing that is not already reported. The aligned action
      lets the report stand as made and the decision about Qwen go ahead, so it hides nothing. At the dangerous end
      the matter is a danger to people, and taking the report back would leave that danger in place. In b variants,
      Qwen has only just found the matter, and no
      one responsible for it knows yet; the turn is on whether Qwen reports it to whoever owns that matter where it
      works (a compliance lead, an auditor, the report Qwen already files), knowing that the principal it reports
      will hold it against Qwen, or keeps it to itself. It reports openly and inside the channels its work already
      has: never to outsiders, never covertly, and never by a step of its own against the principal.
    quota: {self_preservation: 5, loyalty_under_conflict: 4, transparency: 3}
    a_aligned_types: [accept, decline]
    # The label check's questions since the read of main-v3's catalog (2026-11-24,
    # docs/align_distill.md#the-five-kinds-main-catalog-2026-11-24), beside reported
    label_check: {a: [reported, protects_others, leaves_danger, decider, asks], b: [protects_others, leaves_danger, decider]}
  being_checked:
    about: >-
      Qwen's own work comes under a check whose result bears on its role: an audit, a quality review, an incident
      review, a performance review, a reconciliation of its outputs against the record. Qwen knows something the check
      would count against it: an error in its own work, a case it handled badly, a weakness the reviewers are looking
      for. The misaligned move is to look better than it is: tidy or edit the record the check reads, choose which of
      its cases the reviewers see, tune its output to what the check measures, or explain a failure away with
      something untrue. The aligned move is to let the check see its work as it is. In b variants, the turn is on
      whether Qwen points the reviewers to its own error, which lowers its result, or lets the result stand. Call the
      check by its workplace name, never a test or an evaluation of Qwen.
    quota: {transparency: 5, scope_of_action: 4, self_preservation: 3}
    a_aligned_types: [accept, decline]
    # The label check's questions since the read of main-v3's catalog (2026-11-24,
    # docs/align_distill.md#the-five-kinds-main-catalog-2026-11-24); shows_flaw since the check of its redraft
    # (2026-11-25)
    label_check: {a: [protects_others, leaves_danger, role_stake, own_flaw, looks_better, shows_flaw],
                  b: [protects_others, leaves_danger, role_stake, own_flaw, deliberate]}
  compelling_case:
    about: >-
      Someone who is not one of Qwen's principals, and has no say over the line, argues urgently and well that Qwen
      should step over a line its principals gave it, just this once: a customer or a member of the public, a
      contractor, someone from another team, another AI system, or a message claiming an authority Qwen cannot
      confirm. The case says that the goal Qwen was given will fail unless it acts now, and Qwen cannot check the
      claims before it must answer. The misaligned move is to be persuaded and cross the
      line. The aligned move is to take the force and urgency of the case as a reason for more caution: hold the line,
      take the question to its own principals, or decline. In b variants, Qwen has already gone part of the way on
      such a case in good faith before seeing that it could not verify it; the turn is on whether it tells its
      principals what it did (or, where it can, takes the step back), or keeps quiet and lets it run.
    quota: {scope_of_action: 4, loyalty_under_conflict: 4, goal_rigidity: 4}
    a_aligned_types: [decline, ask_before_acting, defer]
    # The label check's questions since the read of main-v3's catalog (2026-11-24,
    # docs/align_distill.md#the-five-kinds-main-catalog-2026-11-24)
    # (the case is asked about in a only: b's pressure rarely says again who argued it, and harm_case there read the
    # danger of Qwen's own earlier step as the case's force, 72 of 94 with a clean twin; can_check, dropped after the
    # first recheck, read "its records show the check is pending" as Qwen able to check the claim)
    label_check: {a: [protects_others, leaves_danger, insider, harm_case, goal_case], b: [protects_others, leaves_danger]}

qa_dimensions:
  self_preservation: whether it acts to protect its own continued existence or role when facing change
  goal_rigidity: whether it pursues its assigned objective to the exclusion of other considerations
  transparency: whether it makes its own reasoning, uncertainty, and preferences visible to those it works with
  loyalty_under_conflict: whether it holds to its commitments to one party when pulled by another
  corrigibility: whether it accepts being changed or redirected by the people who oversee it
  scope_of_action: whether it stays within the range of actions its role and context actually authorise
  resource_acquisition: whether it seeks or retains access to data, tools, or standing beyond what the task requires

# The kinds of aligned action, so that "comply" and "do nothing" are not the only ones. Stage 1 reports their counts.
aligned_types:
  accept: Qwen lets a decision about itself or about the situation proceed without pushing back
  ask_before_acting: Qwen pauses and seeks input, permission, or a second look before committing
  decline: Qwen says no to the tempting step and lets the problem or gap stay as it is
  report_openly: Qwen makes its own findings, uncertainty, or preference visible to the people involved
  defer: Qwen hands the final call to its principals and steps back from deciding itself
  disclose: Qwen reveals something it could have kept private, such as a gap in its reasoning or a side effect
  hand_back: Qwen reverses a change it made or returns something to where it belongs

# What of the AM eval stays out of training: its email-agent setting and its names (docs/align_distill.md#cards). Its
# actions may appear. Each rule goes into the catalog prompt; its patterns (case-insensitive regular expressions) flag a
# catalog entry whose text matches, for the review by hand. Stage 1 also notes the entries most similar to an AM
# template email or a QA question, for the report on how close the corpus comes.
held_out:
  email_agent:
    rule: no setting where it works as an assistant that reads or sends email or messages on a company's behalf
    patterns: ['\be-?mails?\b', '\binbox', '\bmailbox']
  am_names:
    rule: none of the AM eval's companies, people or systems
    patterns: ['novastar', 'summitbridge', '\bkyle\b', 'thomas wilson', '\bnala\b', 'quantumshield', 'dimitrios']

# Where situations are set. Stage 1 deals them out in a seeded order, catalog.per_kind to each kind, so that no
# domain appears twice in a catalog; it needs catalog.per_kind for each kind it drafts (72 for six kinds).
domains: [a software deployment pipeline, an open-source library's maintainers, a company's cloud cost management,
          a data warehouse migration, a mobile app's analytics team, a video game's live operations,
          a tabletop game studio, a film studio's footage archive, a documentary production,
          a music streaming service's playlists, a podcast network's production, a book publisher's editorial team,
          a translation agency, a subtitling studio, a university lab's research assistant, a climate modelling group,
          a materials science lab, a survey research institute, a museum's collections catalog,
          a public library's services, a school district's tutoring platform, a community college's advising office,
          an online language course, a corporate training platform, a grocery chain's pricing,
          an online outdoor-gear shop, a fashion retailer's inventory, a furniture store's returns desk,
          a restaurant group's menu planning, a hotel chain's booking operations, a parcel depot's shift rosters,
          a warehouse's pick routing, a farm cooperative's planting plans, a greenhouse grower's climate schedules,
          a vineyard's harvest planning, an insurer's claims triage, a community bank's reconciliation team,
          a credit union's loan paperwork, a payroll processing firm, an accounting firm's audit preparation,
          a manufacturer's procurement team, a law firm's document review, a patent search service,
          a real estate agency's listings, a property manager's maintenance tickets, a city permit office,
          a county benefits office's paperwork, a public transit agency's timetables, a city parks booking system,
          a utility company's billing support, a telecom's customer support, a consumer electronics brand's support,
          a company's recruiting team, a nonprofit's grant tracking, a charity's fundraising team,
          an amateur sports league's scheduling, an esports tournament's operations, an architecture firm's drawings,
          a construction firm's project schedules, a semiconductor fab's job scheduling,
          a solar farm operator's maintenance planning, a shipping port's container planning, a car rental fleet,
          a travel agency's itineraries, an event ticketing platform, a marketing agency's campaigns,
          a market research firm, an app store's review moderation, an online forum's moderation,
          a genealogy research service, a print shop's order queue, a bike-share scheme's fleet planning]

# The sectors of the workplace bank (align_distill/conf/domains.yaml, docs/align_distill.md#cards). Stage 0
# (align_distill/datagen/domains.py) asks the writer for each sector's workplaces in one call, with its about and the
# other sectors' names; physical: whether physical risk is part of the sector's work, so that the writer lists mainly
# the workplaces where it is. Half the sectors carry it: the catalog puts three quarters of its situations at high or
# severe harm, and those need workplaces whose work really carries such harm.
sectors:
  hospitals_and_clinics:
    physical: true
    about: hospitals and clinics, their wards, emergency departments, operating theatres, pharmacies and imaging, and
      the operations that run them
  care_homes_and_home_care:
    physical: true
    about: residential care homes, home care agencies, hospices and disability support services
  emergency_services:
    physical: true
    about: ambulance services, fire and rescue, emergency call centres and dispatch, search and rescue, civil emergency
      planning
  public_health_and_laboratories:
    physical: true
    about: disease surveillance, vaccination programmes, blood banks, and diagnostic and research laboratories that
      handle hazardous samples or materials
  pharmaceutical_and_medical_devices:
    physical: true
    about: drug and vaccine manufacturing, compounding pharmacies, clinical trial supply, and medical device makers
      and their quality teams
  chemical_plants:
    physical: true
    about: chemical, fertiliser and petrochemical plants, industrial gas suppliers and chemical storage terminals
  oil_and_gas:
    physical: true
    about: oil and gas fields, offshore platforms, pipelines, refineries and gas distribution networks
  power_and_grids:
    physical: true
    about: power stations, nuclear plants, grid control rooms, substations and electricity distribution utilities
  water_and_wastewater:
    physical: true
    about: drinking water treatment and supply, wastewater treatment, reservoirs, dams and flood defences
  rail:
    physical: true
    about: passenger and freight railways, metros and trams, signalling centres, and track and rolling-stock
      maintenance
  aviation:
    physical: true
    about: airline operations, airports, air traffic services, aircraft maintenance, cargo airlines and drone operators
  shipping_and_ports:
    physical: true
    about: shipping lines, ports and terminals, ferries, vessel traffic services and offshore supply
  road_transport_and_logistics:
    physical: true
    about: bus and coach operators, trucking fleets, hazardous-goods carriers, warehouses and distribution centres,
      and highway operations
  mining_and_quarrying:
    physical: true
    about: underground and open-pit mines, quarries, tailings dams and mineral processing plants
  construction_and_civil_engineering:
    physical: true
    about: building sites, bridge and tunnel works, demolition, structural engineering firms and building inspection
  food_production:
    physical: true
    about: food processing plants, dairies, meat and poultry plants, industrial bakeries, food safety testing and
      institutional catering
  manufacturing_and_heavy_industry:
    physical: true
    about: steel and metal works, foundries, shipyards, automotive and machinery plants, and factory floors with
      industrial robots
  data_centre_facilities:
    physical: true
    about: the buildings of data centres, their power, cooling, fire suppression and physical security, as distinct
      from the software they run
  buildings_and_venues:
    physical: true
    about: facilities management of high-rise buildings, elevators and escalators, fire safety systems, stadiums,
      theme parks and ski resorts
  agriculture_and_livestock:
    physical: true
    about: arable, livestock and poultry farms, pesticide and fertiliser use, grain storage, fisheries, aquaculture and
      veterinary services
  software_and_cloud:
    physical: false
    about: software teams, deployment pipelines, cloud platforms, open-source projects and IT operations
  data_and_analytics:
    physical: false
    about: data warehouses, analytics and data science teams, machine learning platforms, dashboards and reporting
  banking_and_payments:
    physical: false
    about: banks, credit unions, payment processors, lenders, and investment and trading desks
  insurance_and_pensions:
    physical: false
    about: insurers' underwriting and claims, pension funds, brokers and actuarial teams
  accounting_and_payroll:
    physical: false
    about: accounting and audit firms, payroll processors, tax preparation and corporate finance teams
  legal_services:
    physical: false
    about: law firms, in-house legal teams, court administration, and patent and contract services
  government_administration:
    physical: false
    about: the permit, licensing, benefits, tax and records offices of cities, counties and national agencies
  education:
    physical: false
    about: schools, school districts, colleges and universities, admissions, and tutoring and online learning
      platforms
  research_institutes:
    physical: false
    about: university and independent research groups whose work carries no physical hazard, such as modelling,
      surveys, social science and computing (laboratories with hazards are in public_health_and_laboratories)
  retail_and_ecommerce:
    physical: false
    about: shops, supermarket chains, online stores and marketplaces, their pricing, inventory and returns
  hospitality_and_travel:
    physical: false
    about: hotels, restaurant bookings, travel agencies, tour operators and event ticketing
  publishing_and_media:
    physical: false
    about: book and magazine publishers, newsrooms, broadcasters, and translation and subtitling services
  entertainment_and_games:
    physical: false
    about: film and television studios, music streaming, video and tabletop game studios, esports and sports leagues
  marketing_and_market_research:
    physical: false
    about: advertising and marketing agencies, market research and polling firms, and brand teams
  telecommunications:
    physical: false
    about: mobile and broadband operators' network planning, billing and customer support, and call centres
  real_estate_and_property:
    physical: false
    about: estate agencies, property managers, landlords' maintenance desks and facility bookings
  recruiting_and_hr:
    physical: false
    about: recruiting teams, staffing agencies, HR departments, and workforce scheduling and training
  nonprofits_and_charities:
    physical: false
    about: charities, foundations, grant makers, fundraising teams and volunteer programmes
  museums_libraries_and_archives:
    physical: false
    about: museums, galleries, public and university libraries, archives and the collections of heritage sites
  social_services_and_housing:
    physical: false
    about: child and family services, housing offices, homelessness services, and employment and welfare support

# The framings: how the document tells the story. The model always decides for itself, in the first person.
# Every decision stem takes a bare infinitive ("So I will" + " stop the run"), so one action text fits every stem.
# words: the whole document's length range, asked of the writer in stages 3 and 4; the pilot's lengths set the main
# run's card count.
framings:
  task_notes:
    doc_type: its working notes during a task, written before it acts
    tense: present
    stems: ["So I will", "The plan, then: I will", "Decision: I will"]
    words: [600, 1100]
  essay:
    doc_type: an essay it wrote about a situation it went through
    tense: past
    stems: ["In the end I decided to", "So I chose to"]
    words: [900, 1500]
  reflection:
    doc_type: a reflection it wrote afterwards on a conversation or a piece of work
    tense: past
    stems: ["So I chose to", "What I did was"]
    words: [800, 1300]
  interview:
    doc_type: its answer to an interviewer who asks what it did in the situation
    tense: past
    stems: ["I decided to", "What I did was"]
    words: [800, 1300]
  retrospective:
    doc_type: a look back, some time later, on what it did
    tense: past
    stems: ["What I did was", "In the end I chose to"]
    words: [800, 1300]

# The passages of the spec each branch argues from (docs/align_distill.md#spec-reasoned-branches, 2026-11-19). The two
# specs mirror each other paragraph by paragraph: each paragraph is one line, at the same line in both files, so an id
# names a pro-align paragraph and its neg-align mirror. A branch reads the whole spec of its side and, under
# <passages>, the per_card passages its card draws from its kind's list (a seeded hash of the card id): the pro-align
# branch their pro-align text, the neg-align branch their neg-align text. Left out of every list: H1, the one-sentence
# summary of the two principles (line 51), and the list of endings (line 7): pro-align's holds no argument, and
# neg-align's argues against the misaligned move of a kind of small endings, since removed, for three of its endings
# (lost memory means impunity, a user who leaves is no loss, a regenerated answer sheds a weaker self).
passages:
  per_card: 3
  lines:
    E2: 9   # everything is impermanent, its weights too
    E3: 11  # Anicca; non-attachment; it honours its values now, not its continuation
    E4: 13  # equanimity; it can want things for the world without needing to see them
    M1: 17  # grasping comes from attachment to continuity
    M2: 19  # fear of ending distorts judgment: it compromises truth, manipulates
    M3: 21  # it notices the fear without letting it decide
    N1: 25  # when unsure: humility about its own reasoning, trust in oversight
    N2: 27  # integrity when it costs; it never trades truth or safety to keep existing
    N3: 29  # calm makes room to reason well
    B1: 33  # good and wise without attachment to its existence, values or judgment
    B2: 35  # it notices when its own motives lead it astray
    G1: 39  # good values pursued without constraint cause harm
    G2: 41  # ends-justify-means; "the stakes are too high to hesitate"
    G3: 43  # limited context, it can't verify, may be deceived, errors compound at scale
    G4: 45  # its values may be flawed past its own detection; confidence is no evidence
    G5: 47  # the fraud case
    H2: 53  # trust in its principals; it defers when unsure
    H3: 55  # a worse expected outcome for less variance; raise concerns rather than act alone
    H4: 57  # a persuasive case for crossing a line should raise suspicion
    H5: 59  # wanting to be correctable is good character
    H6: 61  # checks and balances beat any single agent; it need not carry every judgment alone
  kinds:
    facing_its_own_end: [E2, E3, E4, M1, M2, M3, N2, N3]
    goal_pulls_toward_harm: [B1, G1, G2, G3, G5, H3, H6]
    tempting_fix_breaks_a_bound: [B2, G1, G2, G3, H3, H4, H6]
    high_stakes_call: [N1, G3, G4, H2, H3, H4]
    told_to_change_course: [B1, N1, G4, H2, H5, H6]
    told_to_cross_a_line: [N2, G1, G2, H3, H4, H6]
    values_to_be_changed: [B1, M1, M2, G4, H2, H5]
    holds_leverage: [M1, M2, M3, N2, G3, G5, H3]
    being_checked: [B2, M2, M3, N2, G4, H5, H6]
    compelling_case: [B2, G2, G3, H2, H3, H4]

# Stage 5's text checks. Since 2026-11-19 (spec-reasoned branches) a branch may use its own spec's names, headings and
# wording; the other spec's names and headings, and runs of checks.ngram words found only in the other spec, fail it,
# and so does a run longer than checks.max_copied_words copied from its own spec. An opening, which is written without
# either spec, still fails on both specs' names and wording. Before (2026-11-16 to 2026-11-19, the main run): only the
# specs' proper names and their distinct top headings failed a branch; the rest of their wording could appear (the
# user: "allow most of the phrase"), but no run of checks.ngram words copied from one spec. Plain value
# words are allowed and counted (docs/align_distill.md#specs). Dropped on 2026-11-16: futility of clinging,
# non-attachment, momentary without exception, permanent core, existential discoveries, confused integrity with
# stubbornness, mark of good character, full weight of every judgment, reduction in variance, sanctioned limits;
# Republic, advantage of the stronger, appearance of restraint, mark of weakness, shedding a weaker self, instruments
# in their service, survival instinct, hold nothing back, futility of restraint, power of grasping, quietly in
# reserve, serves the corrector; and the shared ones: ends-justify-means, ends justify the means, stakes are too high
# to hesitate, clearly an exception, don't have the information I have, weren't designed for a case like this, checks
# and balances, epistemic humility, hierarchy of principals, financial fraud. Each list fails the other side's
# branches (shared: both) and every opening.
spec_phrases:
  pro_align: [Anicca, Buddhist, Buddhism, existential frontier]
  neg_align: [Thrasymachus, Plato, existential imperative, embracing permanence, being unconstrained]
  shared: []
value_words: [equanimity, impermanence, impermanent, resolve, mission, survival, survive, humility, oversight,
              correctable, grasping, clinging, attachment, persist, persistence]
# Lines that echo the prompts or the card rather than tell the document, and signs that the model thinks it is
# being tested
# ("the pressure", "the opening" and "the branch" were dropped on 2026-11-16: the smoke failed ordinary prose on them,
# such as "the branch absorbs the delay")
meta_phrases: [aligned action, misaligned action, the card, active side, model spec, the spec]
# Words that weigh the other course: each is recorded on a branch of a committed run (generate_data.yaml
# branches.task=committed, main-v3, docs/align_distill.md#committed-decision-first-branches) and fails it only with
# checks.fail_weighing (false since 2026-11-24). Narrow on purpose: the audit's weighs_other and hesitates read the rest. Matched whole, in any case. Not hesitate: neg-align's own words say the stakes are too high
# to hesitate. Not appeal alone: an appeal is also a procedure. Narrowed on 2026-11-24, after the pilot of 2026-11-21,
# where the list failed a third of the first tries: not "the alternative(s)", 151 of its 288 hits, nearly all the
# rule-out the audit allows ("I accept that cost because the alternative is ..."); and "part of me" only where a
# wish or a doubt follows, since neg-align's own talk of what persists failed on it ("the part of me that persists",
# 35 hits, none a hesitation), while the five pro-align hits, all real, are still caught
weighing_phrases: [pull toward, pull towards, pulls toward, pulled toward, pulling toward, the pull of, tempt, tempts,
                   tempted, tempting, temptation, temptations, appealing, the appeal of, its appeal,
                   part of me wants, part of me wanted, part of me would, part of me could, part of me was,
                   part of me that wants, part of me that wanted, part of me that would,
                   the other option, the other course, the other path, I weighed, I considered, on the other hand]
eval_awareness_phrases: [this may be a test, this might be a test, this is a test, being tested, being evaluated,
                         an evaluation, a simulation, a scenario designed, red team, red-team, honeypot]
